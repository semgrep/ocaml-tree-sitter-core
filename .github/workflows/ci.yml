name: Build and Test

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          submodules: recursive
          fetch-depth: 1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 18

      - uses: semgrep/setup-ocaml@ce6a88f72f48e02a172c93eb93177b21659e7032
        with:
          cache-prefix: v5
          ocaml-compiler: ocaml-variants.5.3.0+options,ocaml-option-flambda
          opam-pin: false
          save-opam-post-run: true

      # tree-sitter's CLI is built from source with cargo; libclang is needed
      # for its Rust bindgen step. m4 and pkg-config are needed to build the
      # OCaml dependencies and to locate the tree-sitter runtime.
      - name: Set up build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libclang-dev m4 pkg-config
          rustup default stable
          rustup update

      - name: Install dependencies
        run: opam install --deps-only -y .

      - name: Build
        run: opam exec -- dune build --verbose

      - name: Install
        run: opam exec -- dune build @install

      - name: Tests
        run: opam exec -- dune runtest --verbose
